<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientific Claim Verifier</title>
<meta name="description" content="Ask questions about a collection of research papers. Every cited claim in the answer is checked against the passage it cites.">
<meta name="theme-color" content="#0e1013">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var t = (JSON.parse(localStorage.getItem("scv_settings") || "{}").theme) || "dark";
    if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="vendor/katex/katex.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Chats">
    <div class="brand">
      <div>
        <div class="brand-name">Scientific Claim Verifier</div>
        <div class="brand-sub">Every citation, checked</div>
      </div>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary btn-block" id="newChatBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
      <div class="search-box">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="chatSearch" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
      </div>
    </div>
    <nav class="chat-list" id="chatList" aria-label="Chat history"></nav>
    <div class="sidebar-footer">
      <div id="builds"></div>
      <button class="nav-item" id="libraryBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>Library<span class="count" id="libraryCount"></span></button>
      <button class="nav-item" id="settingsBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Settings</button>
      <div class="health" id="health" role="status"><span class="dot"></span><span>Connecting…</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open sidebar"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="collection-btn" id="collectionBtn" aria-haspopup="menu" title="Switch collection (Ctrl+K)">
        <span class="cb-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg></span>
        <span class="cb-text"><div class="cb-name">Loading…</div><div class="cb-meta"></div></span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="icon-btn" id="exportBtn" title="Export chat as Markdown" aria-label="Export chat as Markdown" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <button class="icon-btn" id="newChatTop" title="New chat" aria-label="New chat"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </header>

    <section class="thread" id="thread" aria-label="Conversation">
      <div class="thread-inner" id="threadInner"></div>
    </section>
    <button class="btn btn-sm jump-latest" id="jumpLatest" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>Latest</button>

    <footer class="composer-wrap">
      <div class="composer">
        <label for="question" class="sr-only">Your question</label>
        <textarea id="question" rows="1" placeholder="Loading…"></textarea>
        <div class="composer-bar">
          <button class="pill-btn" id="modelBtn" aria-haspopup="menu" title="Model"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg><span>Auto</span></button>
          <button class="pill-btn" id="sourcesBtn" aria-haspopup="menu" title="Passages to retrieve"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg><span>5 passages</span></button>
          <div class="grow"></div>
          <span class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
          <button class="send-btn" id="sendBtn" aria-label="Send" disabled></button>
        </div>
      </div>
      <div class="disclaimer">Answers draw only on this collection's papers. Citations are checked automatically - open flagged ones before relying on them.</div>
    </footer>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="popover" id="popover" role="tooltip" hidden></div>
</body>
</html>
